# Nacli: a manager for the whole UnownHash stack (Dragonite, RotomNG, Golbat
# and Zapdos), for as many Dragonite + RotomNG stacks as you run.
#
# Copy this file to config.toml and edit it. Only [server] and one [[users]]
# are needed; every other section is optional, and Nacli shows the pages that
# what you give it allows. Changes are picked up on save, with no restart.
#
# Durations are written like "30s", "5m", "24h".

# ─── Server ──────────────────────────────────────────────────────────────────

[server]
title = "Nacli"
# Address and port to listen on. In Docker keep 0.0.0.0 so it is reachable.
listen = "0.0.0.0:7080"
# Signs the session cookies. Use a long random string: if it is empty, one is
# generated at startup and everyone is signed out on every restart.
session_secret = ""
# How long a sign-in lasts.
session_ttl = "24h"
# Mark the cookie Secure. Turn it on when serving over HTTPS (it is also on
# whenever a proxy sends X-Forwarded-Proto: https).
secure_cookies = false
# Longest wait for any instance.
request_timeout = "8s"

# For the instances Zapdos does not cover, Nacli reads their metrics itself
# and keeps the charts in memory:
#   poll_interval      how often they are read (at least "30s")
#   history_retention  how much is kept
#   state_file         where it is saved on exit and every 5 minutes, and
#                      loaded at start ("" keeps it in memory only). Relative to
#                      the working folder; in Docker, mount /app/data.
poll_interval = "30s"
history_retention = "24h"
# state_file = "data/state.json.gz"

# ─── Users ───────────────────────────────────────────────────────────────────

# Who can sign in. Add one [[users]] block per person.
[[users]]
username = "admin"
password = "change-this-password"

# ─── Stacks ──────────────────────────────────────────────────────────────────

# One [[stack]] per deployment: a Dragonite and the RotomNG it sends its
# controllers to. Add as many as you run; each one keeps its own colour across
# Nacli, and areas, modes, schedules and proxies can be copied between them.
# A stack can have both parts, or only one of them.
#
# [stack.rotom]
#   url              RotomNG's http_listener, without the /api suffix.
#   api_secret       Its http_listener.secret (leave it out if there is none).
#   zapdos_instance  (optional) Its `instance` label in Zapdos, for the charts.
#
# [stack.dragonite]
#   url              Its API: Dragonite's own ("http://host:7272") or its admin
#                    + "/api". Enables Accounts, Areas, Unbound Modes, Proxies,
#                    Scheduler and Status. Use Dragonite's own to also get its
#                    charts without Zapdos (the admin does not serve /metrics).
#   api_secret       (optional) Sent as X-Dragonite-Admin-Secret.
#   zapdos_instance  (optional) Its `instance` label in Zapdos, for the charts.
#   database         (optional) Its database on the [database] server. A DB
#                    pill shows next to Dragonite in the sidebar. RotomNG has
#                    no database.
#
# Both also take, when there is a proxy in front:
#   headers     = { "CF-Access-Client-Id" = "...", "CF-Access-Client-Secret" = "..." }
#   basic_auth  = { username = "...", password = "..." }

[[stack]]
name = "Alpha"

[stack.dragonite]
url = "http://10.0.0.10:7272"
zapdos_instance = "dragonite-alpha"
# database = "dragonite_alpha"

[stack.rotom]
url = "http://10.0.0.10:7072"
api_secret = "..."
zapdos_instance = "rotom-alpha"

[[stack]]
name = "Beta"

[stack.dragonite]
url = "http://10.0.0.11:7272"
zapdos_instance = "dragonite-beta"
# database = "dragonite_beta"

[stack.rotom]
url = "http://10.0.0.11:7072"
api_secret = "..."
zapdos_instance = "rotom-beta"

# ─── Golbat (optional, shared by every stack) ────────────────────────────────

# With url and api_secret: the devices on the Dashboard map with their trails,
# the Statistics page per area, and Golbat on Status.
#   zapdos_instance      (optional) Its `instance` label in Zapdos, for the charts.
#   stats_poll_interval  (optional) How often the Statistics are taken to chart
#                        their last 24 h (at least "5m"; each take asks Golbat
#                        about every area). Leave it out for no history.
#   database             (optional) Golbat's database on the [database] server:
#                        the Spawnpoints and Encounters pages. A DB pill shows
#                        next to Golbat in the sidebar.
# [golbat]
# url = "http://10.0.0.20:9001"
# api_secret = "..."
# zapdos_instance = "golbat"
# stats_poll_interval = "5m"
# database = "golbat"

# ─── Database (optional) ─────────────────────────────────────────────────────

# The MariaDB server of the stack. Each part names its own database on it:
# database in [golbat] and in each [stack.dragonite]. Give Nacli an account of
# its own. It reads and writes, but only these tables: grant just what you use.
# A grant names user and host: 'nacli'@'%' and 'nacli'@'localhost' are different
# accounts. The Help page writes these lines for the account Nacli logs in as.
#   CREATE USER IF NOT EXISTS 'nacli'@'%' IDENTIFIED BY '...';
#   GRANT SELECT ON golbat.spawnpoint TO 'nacli'@'%';             -- Spawnpoints, DB pill
#   GRANT SELECT ON golbat.pokemon_area_stats TO 'nacli'@'%';     -- Encounters
#   GRANT DELETE ON golbat.spawnpoint TO 'nacli'@'%';             -- deleting spawnpoints
#   GRANT SELECT ON dragonite_alpha.account TO 'nacli'@'%';       -- each Dragonite: DB pill, moving
#   GRANT INSERT, DELETE ON dragonite_alpha.account TO 'nacli'@'%';  -- moving accounts
# The Help page (user menu, top right) walks through every step.
# [database]
# host = "10.0.0.40"
# port = 3306
# username = "nacli"
# password = "..."

# ─── Zapdos (optional, shared by every stack) ────────────────────────────────

# Zapdos (https://github.com/UnownHash/Zapdos), UnownHash's metrics stack: url
# is its VictoriaMetrics (port 8428). Charts come from here, up to 30 days, for
# every instance whose zapdos_instance has data; the rest come from memory.
# [zapdos]
# url = "http://10.0.0.30:8428"
# username = "vmuser"            # Basic Auth, if it asks for it
# password = "..."
# bearer_token = "..."           # instead of username/password
# instance_label = "instance"    # the label that tells instances apart
# selector = 'job="unown"'       # extra filter added to every query

# ─── Map ─────────────────────────────────────────────────────────────────────

# The basemap of every map (Dashboard, areas, scout jobs). Without it the maps
# draw on a plain grey background. The browser loads these tiles itself, so
# the URLs and key must be public.
#   style_url       Vector style (MapLibre GL), e.g. CARTO's.
#   style_url_dark  (optional) The same for the dark theme.
#   tiles_url       Raster tiles {z}/{x}/{y}, instead of style_url.
#   carto_key       (optional) CARTO client key, added to its URLs.
[map]
style_url = "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json"
style_url_dark = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
# tiles_url = "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"
# carto_key = "..."
tiles_attribution = "&copy; OpenStreetMap &copy; CARTO"
