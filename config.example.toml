# Nacli dashboard configuration.
# Copy this file to config.toml and edit it. Changes are reloaded automatically
# on save (or with SIGHUP); no restart needed.

[server]
title = "Nacli"
# Address and port the dashboard listens on.
listen = "0.0.0.0:7080"
# Key used to sign sessions. If left empty, one is generated at startup
# (sessions are lost on restart). Use a long random string.
session_secret = ""
# Session duration after logging in.
session_ttl = "24h"
# Mark the cookie as Secure (enable it if you serve the dashboard over HTTPS; it
# is also enabled automatically if the proxy sends X-Forwarded-Proto: https).
secure_cookies = false
# RotomNG and Dragonite are read on demand, when a page needs them. This is how
# often the metrics of RotomNG, Dragonite and Golbat are read for the history
# kept in memory (only for those VictoriaMetrics does not cover). A shorter
# interval gives finer charts and uses more memory.
poll_interval = "10s"
# Maximum wait time per request to an instance.
request_timeout = "8s"
# How much chart history is kept in memory. Charts use it for every instance
# that VictoriaMetrics does not cover: without [victoriametrics], without a
# vm_instance, or with a vm_instance that has no data there.
history_retention = "24h"

# Basemap for every map in Nacli: the Dashboard (devices, area geofences and
# controller trails) and Unbound Modes (scout jobs). Configure it: without it
# the maps only draw their points on a plain grey background, with no streets.
# The browser loads the tiles directly, so these URLs and key must be public.
#   style_url          Vector tile style (MapLibre GL), e.g. from CARTO.
#   style_url_dark     (optional) Style for the dark theme; style_url is used if unset.
#   tiles_url          Raster tiles {z}/{x}/{y}, instead of style_url.
#   carto_key          (optional) CARTO key, appended as api_key to its URLs.
#                      It is used by the browser, so it must be a client key.
#   tiles_attribution  Attribution shown on the map (HTML).
[map]
style_url = "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json"
style_url_dark = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
# tiles_url = "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"
# carto_key = "..."
tiles_attribution = "&copy; OpenStreetMap &copy; CARTO"

# Users who can log in. Add as many [[users]] blocks as you like.
[[users]]
username = "admin"
password = "change-this-password"

# One [[stack]] block per deployment: a RotomNG and, if present, the Dragonite
# that sends it its controllers.
#   name  Name shown in the dashboard. If there is a Dragonite, it must match the
#         one in its user agent ("Dragonite/x.y (Dragonite - <name>)"):
#         that is how the dashboard checks that its controllers reach this Rotom.
#
# [stack.rotom]
#   url          Root of the RotomNG http_listener, WITHOUT the /api suffix.
#   api_secret   That instance's http_listener.secret (omit it if it has none).
#   vm_instance  (optional) Its `instance` label in VictoriaMetrics; only used with
#                [victoriametrics]. Without it, or if it has no data there, its
#                charts come from memory (history_retention).
#   headers      (optional) Extra headers, e.g. for a proxy in front.
#   basic_auth   (optional) { username = "...", password = "..." } if the proxy requires Basic Auth.
#
# [stack.dragonite]  (optional)
#   url          (optional) Its API: Dragonite's own ("http://host:7272") or its
#                admin + "/api". Enables Accounts, Areas, Unbound Modes, Proxies,
#                Scheduler and Status, and their actions (create, edit, enable...).
#                Passwords, emails and tokens never leave the server.
#                Nacli also reads its /metrics every poll_interval and keeps history_retention
#                in memory; for that, url must be Dragonite's own (the admin does not
#                expose /metrics).
#   vm_instance  (optional) Its `instance` label in VictoriaMetrics; only used with
#                [victoriametrics]. Without it, or if it has no data there, its
#                charts come from memory. A chart of several Dragonites comes from
#                memory as soon as one of them does.
#   api_secret   (optional) Sent as the X-Dragonite-Admin-Secret header.
#   headers / basic_auth  (optional) Same as in [stack.rotom].

[[stack]]
name = "Exeggcute"

[stack.rotom]
url = "http://10.0.0.10:7072"
vm_instance = "rotom-ng"
api_secret = ""

[stack.dragonite]
url = "http://10.0.0.10:7272"
vm_instance = "dragonite"

[[stack]]
name = "Lunala"

[stack.rotom]
url = "http://10.0.0.11:7072"
vm_instance = "rotom-ng-lunala"
# headers = { "CF-Access-Client-Id" = "...", "CF-Access-Client-Secret" = "..." }
# basic_auth = { username = "rotom", password = "..." }

# (Optional) Golbat. Each part enables something different:
#   url / api_secret  Its API and its api_secret: the devices on the Dashboard
#                     map (with their trails), Golbat's state on Status, and
#                     the Golbat Metrics page from history_retention in memory
#                     (Nacli reads its /metrics every poll_interval).
#   vm_instance       (optional) Its `instance` label in VictoriaMetrics; only
#                     used with [victoriametrics]: the Metrics page then draws
#                     the stored data (up to 30 days). Without it, or if it has
#                     no data there, the page comes from memory.
# [golbat]
# url = "http://10.0.0.20:9001"
# api_secret = "..."
# vm_instance = "golbat"

# (Optional) VictoriaMetrics or Prometheus already scraping the instances'
# metrics. Charts come from here (up to 30 days) for every instance whose
# vm_instance has data; the rest keep using the history in memory. Nacli checks
# which ones have data at startup, on every config change and every 5 minutes.
# [victoriametrics]
# url = "https://vm.example.com"
# username = "vmuser"            # Basic Auth, if required
# password = "..."
# bearer_token = "..."           # alternative to username/password
# instance_label = "instance"    # label identifying each RotomNG
# selector = 'job="rotom"'       # optional extra filter for all queries
