<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="nacli" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#1c1c21"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#71717a"/>
    </marker>
    <!-- A database: drawn in the colour of whoever uses it. -->
    <symbol id="db" viewBox="0 0 14 16">
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <ellipse cx="7" cy="3.2" rx="5.6" ry="2.3"/>
        <path d="M1.4 3.2v9.6c0 1.3 2.5 2.3 5.6 2.3s5.6-1 5.6-2.3V3.2"/>
        <path d="M1.4 8c0 1.3 2.5 2.3 5.6 2.3s5.6-1 5.6-2.3"/>
      </g>
    </symbol>
  </defs>

  <!-- Card -->
  <rect x="0.5" y="0.5" width="959" height="579" rx="20" fill="#0e0e11" stroke="#27272a"/>

  <!-- Links: browser → Nacli -->
  <path d="M154 290 H232" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Links: Nacli → stacks, shared services and the database server -->
  <g stroke="#52525b" stroke-width="2" fill="none">
    <path d="M430 290 C 480 290, 480 92, 532 92"/>
    <path d="M430 290 C 480 290, 480 190, 532 190"/>
    <path d="M430 290 C 480 290, 480 288, 532 288" stroke-dasharray="5 5"/>
    <path d="M430 290 C 480 290, 480 390, 532 390"/>
    <path d="M430 290 C 480 290, 480 500, 532 500"/>
  </g>

  <!-- Browser -->
  <g>
    <rect x="34" y="245" width="120" height="90" rx="14" fill="#18181b" stroke="#3f3f46"/>
    <rect x="52" y="263" width="84" height="40" rx="6" fill="none" stroke="#a1a1aa" stroke-width="2"/>
    <path d="M80 313 H108" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
    <text x="94" y="355" fill="#a1a1aa" font-size="13" text-anchor="middle">Browser or phone</text>
  </g>

  <!-- Nacli -->
  <g>
    <rect x="234" y="205" width="196" height="170" rx="18" fill="url(#nacli)" stroke="#52525b" stroke-width="1.5"/>
    <text x="332" y="267" fill="#fafafa" font-size="30" font-weight="700" text-anchor="middle">Nacli</text>
    <text x="332" y="293" fill="#a1a1aa" font-size="13" text-anchor="middle">one login · one web app</text>
    <g font-size="11.5" fill="#d4d4d8" text-anchor="middle">
      <rect x="258" y="313" width="70" height="24" rx="12" fill="#27272a"/>
      <text x="293" y="329">dashboard</text>
      <rect x="336" y="313" width="70" height="24" rx="12" fill="#27272a"/>
      <text x="371" y="329">actions</text>
      <rect x="258" y="343" width="148" height="24" rx="12" fill="#27272a"/>
      <text x="332" y="359">secrets stay on the server</text>
    </g>
  </g>

  <!-- Stack 1 -->
  <g>
    <rect x="534" y="52" width="392" height="80" rx="14" fill="#18181b" stroke="#3b82f6" stroke-opacity="0.55"/>
    <circle cx="556" cy="78" r="5" fill="#3b82f6"/>
    <text x="568" y="83" fill="#fafafa" font-size="14" font-weight="600">Stack 1</text>
    <g font-size="13" fill="#e4e4e7">
      <rect x="556" y="94" width="170" height="28" rx="8" fill="#27272a"/>
      <text x="572" y="113">Dragonite</text>
      <use href="#db" x="700" y="100" width="14" height="16" color="#3b82f6"/>
      <rect x="736" y="94" width="170" height="28" rx="8" fill="#27272a"/>
      <text x="752" y="113">RotomNG</text>
    </g>
  </g>

  <!-- Stack 2 -->
  <g>
    <rect x="534" y="150" width="392" height="80" rx="14" fill="#18181b" stroke="#f97316" stroke-opacity="0.55"/>
    <circle cx="556" cy="176" r="5" fill="#f97316"/>
    <text x="568" y="181" fill="#fafafa" font-size="14" font-weight="600">Stack 2</text>
    <g font-size="13" fill="#e4e4e7">
      <rect x="556" y="192" width="170" height="28" rx="8" fill="#27272a"/>
      <text x="572" y="211">Dragonite</text>
      <use href="#db" x="700" y="198" width="14" height="16" color="#f97316"/>
      <rect x="736" y="192" width="170" height="28" rx="8" fill="#27272a"/>
      <text x="752" y="211">RotomNG</text>
    </g>
  </g>

  <!-- More stacks -->
  <g>
    <rect x="534" y="262" width="392" height="52" rx="14" fill="none" stroke="#3f3f46" stroke-dasharray="6 5"/>
    <circle cx="556" cy="288" r="5" fill="#22c55e"/>
    <text x="568" y="293" fill="#a1a1aa" font-size="14">More stacks, as many as you run</text>
  </g>

  <!-- Shared services -->
  <g>
    <rect x="534" y="350" width="392" height="80" rx="14" fill="#18181b" stroke="#3f3f46"/>
    <text x="556" y="381" fill="#a1a1aa" font-size="12" letter-spacing="1">SHARED BY EVERY STACK</text>
    <g font-size="13" fill="#e4e4e7">
      <rect x="556" y="392" width="170" height="28" rx="8" fill="#27272a"/>
      <text x="572" y="411">Golbat</text>
      <use href="#db" x="700" y="398" width="14" height="16" color="#a855f7"/>
      <rect x="736" y="392" width="170" height="28" rx="8" fill="#27272a"/>
      <text x="752" y="411">Zapdos</text>
    </g>
  </g>

  <!-- The database server: one database per part that has one -->
  <g>
    <rect x="534" y="450" width="392" height="96" rx="14" fill="#18181b" stroke="#3f3f46"/>
    <use href="#db" x="556" y="468" width="14" height="16" color="#a1a1aa"/>
    <text x="578" y="481" fill="#a1a1aa" font-size="12" letter-spacing="1">MARIADB · A DATABASE PER PART</text>
    <g font-size="12.5" fill="#e4e4e7">
      <rect x="556" y="496" width="112" height="28" rx="8" fill="#27272a"/>
      <circle cx="570" cy="510" r="4" fill="#a855f7"/>
      <text x="580" y="514">golbat</text>
      <rect x="675" y="496" width="112" height="28" rx="8" fill="#27272a"/>
      <circle cx="689" cy="510" r="4" fill="#3b82f6"/>
      <text x="699" y="514">dragonite 1</text>
      <rect x="794" y="496" width="112" height="28" rx="8" fill="#27272a"/>
      <circle cx="808" cy="510" r="4" fill="#f97316"/>
      <text x="818" y="514">dragonite 2</text>
    </g>
    <text x="556" y="538" fill="#71717a" font-size="11">reads · deletes spawnpoints · moves accounts between stacks</text>
  </g>

  <text x="34" y="548" fill="#71717a" font-size="12">Every part is optional: Nacli shows what your config.toml gives it.</text>
</svg>
